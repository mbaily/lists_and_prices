<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- PWA manifest — tells browsers/iOS this is an installable app -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<!-- Supply icons before hydration so browsers do not request /favicon.ico. -->
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<style>
			#startup-loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #fff; color: #666; font: 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
			@media (prefers-color-scheme: dark) { #startup-loading { background: #000; color: #aaa; } }
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="startup-loading" role="status">Loading the app…</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
