# systemd drop-in: /etc/systemd/system/lists-and-prices.service.d/proxy.conf
# Build this installation with APP_BASE_PATH=/lists_and_prices.
[Service]
ExecStart=
ExecStart=/usr/bin/npm start -- --port 3101
Environment=LISTS_HOST=127.0.0.1
Environment=LISTS_TLS=off
Environment=SESSION_COOKIE_SECURE=true
